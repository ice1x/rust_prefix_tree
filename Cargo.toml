[package]
name = "metatrie"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A prefix-tree (trie) autocomplete index whose nodes carry metadata records, with prefix collection, field queries, sort-by-field and optional typo-tolerant fuzzy search. Exposable to Python via PyO3."
license = "Apache-2.0"
repository = "https://github.com/ice1x/rust_prefix_tree"
readme = "README.md"
keywords = ["trie", "autocomplete", "typeahead", "prefix", "fuzzy"]
categories = ["data-structures", "text-processing"]
# Ship only crate sources, Rust tests, Cargo.toml, README and LICENSE.
include = [
    "/src/**/*",
    "/tests/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

# rlib  -> normal Rust library (tests, benches, downstream crates).
# cdylib -> the PyO3 extension module, built only with the `python` feature.
[lib]
name = "metatrie"
crate-type = ["cdylib", "rlib"]

[features]
# Pure Rust, zero dependencies by default.
default = []
# Opt-in Unicode key normalization (NFKD + case/diacritic folding).
normalize = ["dep:unicode-normalization"]
# PyO3 extension module exposing the Record-based trie to Python.
python = ["dep:pyo3"]

[dependencies]
unicode-normalization = { version = "0.1", optional = true }

[dependencies.pyo3]
version = "0.22"
features = ["extension-module", "abi3-py39"]
optional = true

[profile.release]
lto = true
codegen-units = 1
