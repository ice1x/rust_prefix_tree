name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Staged pipeline: lint -> test -> wheel+pytest. Each stage gates the next so a
# failure surfaces at the earliest, cheapest point.
jobs:
  lint:
    name: 1 · lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (normalize feature)
        run: cargo clippy --all-targets --features normalize -- -D warnings
      - name: Clippy (python feature)
        run: cargo clippy --all-targets --features python -- -D warnings

  test:
    name: 2 · test (unit + integration + doctests)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default)
        run: cargo test
      - name: cargo test (normalize feature)
        run: cargo test --features normalize

  wheel:
    name: 3 · wheel (maturin → pytest)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel and run the Python surface tests
        run: |
          python -m pip install --upgrade maturin pytest
          maturin build --release --out dist
          python -m pip install --find-links dist metatrie
          pytest tests/python -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
