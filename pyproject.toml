[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "metatrie"
description = "Prefix-tree autocomplete index with metadata records (Rust/PyO3)."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[tool.maturin]
# Build the PyO3 extension module (the `python` Cargo feature) as an abi3 wheel.
features = ["python"]
